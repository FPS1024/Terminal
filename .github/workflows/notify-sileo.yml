name: Notify Sileo repository

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Sileo index update
        env:
          GH_TOKEN: ${{ secrets.SILEO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SILEO_DISPATCH_TOKEN is not configured; skipping."
            exit 0
          fi
          gh api repos/FPS1024/sileo.github.io/dispatches \
            -f event_type=package-release
